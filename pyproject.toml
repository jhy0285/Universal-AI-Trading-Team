[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "universal-ai-trading-team"
version = "0.1.0"
description = "A single-model, deterministic paper trading research desk"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "sqlalchemy>=2.0.40,<3",
  "psycopg[binary]>=3.2,<4", "apscheduler>=3.11,<4", "streamlit>=1.45,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]

[project.scripts]
trading-team = "trading_team.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_team"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires an explicitly configured test database or service"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
